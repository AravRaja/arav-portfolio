# Phase 2 / S6 (c): b + AMP (w_amp 1.0), tracking weights halved, moves per 8-count from the section_energy choreographer. Was (b): a + low-weight phase-1 music terms (claps = arrive_*, bounce, facing, drift). Was: pure DeepMimic-style tracking of the motion library (PLAN section 14).
# Env = s6_c's env block (same obs flags, so s6_c's 119 inputs are the first 119 of the 200-dim track obs and
# pad_obs_params grows best.pkl with zero rows for the 81-dim track block appended at the end).
# Music terms off except upright / fall / torque / action_rate. RSI 0.9, early termination, 4096 envs, 200M.
name: s7_c_amp
stage: 5
mode: track
init_checkpoint: runs/s7_b/checkpoints/best.pkl   # round 1: from s7_b (was s6_c)
music_source: song
features: features/now-get-busy.v2.features.npz
features_version: 2

track:
  library: data/library/moves.npz   # override with $DANCE_TRACK_LIBRARY (e.g. runs/synth_lib/moves.npz)
  filter: {max_speed_factor: 1.2}   # 389 of 602 moves (+ mirrors); travelling moves kept for the high-energy tier
  sequence: [1, 3]                  # 1-3 random moves per episode, cycled per 8-count (loops + transitions)
  move_weights: null                # uniform
  choreo: section_energy            # deterministic per-8-count schedule (track_ref.choreograph)
  rsi_prob: 0.9
  rsi_noise: 0.02
  rsi_vel_scale: 1.0
  lookahead: [1, 5, 10]
  term_rms: 0.6                     # rad rms joint error -> early termination
  term_height: 0.3                  # m below the reference root height -> early termination
  term_grace: 20                    # steps after the episode start / every unit boundary without termination
  fall_rel: 0.25                    # fall = pelvis z < reference pelvis z - 0.25 m (pays reward_weights.fall)
  s_pose: 2.0
  s_vel: 0.1
  s_ee: 40.0
  s_h: 10.0
  s_ori: 10.0
  s_yaw: 0.1
  track_root_xy: false

env:
  ctrl_dt: 0.02
  sim_dt: 0.004
  episode_seconds: 16.0
  forced_start_time: 4.0
  forced_start_prob: 0.1            # s6_c 0.35: fewer intro (idle-reference) starts
  forced_start_range: [0.0, 6.0]
  init_noise: 0.02
  fall_height: 0.2                  # s6_c 0.7: library pelvis goes down to 0.31 m; the real fall check is track.fall_rel
  height_band: [0.8, 1.3]
  height_falloff: 0.3
  contact_height: 0.02
  m_lowpass_hz: 10.0
  m_floor: 0.1
  m_ref: 1.5
  groove_sigma: 1.0
  alternation_sigma: 1.0
  variety_sigma: 1.0
  idle_bob_clip: 0.1
  kick_window_s: 0.06
  kick_threshold: 0.5
  drift_leash: 1.0
  joint_limit_margin: 0.05
  accent_signal: grid_kick
  accent_pulse_sigma: 0.08
  drift_vel_penalty: true
  spin_penalty: true
  heading_obs: true
  music_obs_v2: true
  full_body_v2: true
  bounce_a1: 0.015
  bounce_a2: 0.006
  bounce_sigma: 0.01
  knee_target_deg: 20.0
  knee_sigma_deg: 10.0
  nod_phase: 0.25
  nod_clip: 1.0
  accent_mode: arrive
  arrive_approach_window: [-0.20, -0.06]
  arrive_early_window: [-0.35, -0.20]
  arrive_decel_window: [-0.08, 0.03]
  arrive_hold_window: [0.03, 0.20]
  arrive_decel_ref: 10.0
  arrive_decel_cap: 2.0
  facing_mode: sq
  torso_rock_deg: 6.0
  torso_rock_sigma_deg: 3.0
  torso_rock_phase: -0.415
  step_signal: beat
  alternation_mirror_fix: true
  weight_transfer_w: 0.03
  weight_transfer_sigma: 0.015
  weight_transfer_phase: -0.455
  structure: variety                # s6_c mirror_alt off (no pose-history structure terms while tracking)

reward_weights:
  # tracking (DeepMimic proportions 0.65 / 0.1 / 0.15 / 0.1, scaled to ~6 per step)
  track_pose: 1.5              # s7c: halved
  track_vel: 0.25              # s7c: halved
  track_ee: 0.75              # s7c: halved
  track_root: 0.5              # s7c: halved
  track_fail: 0.0
  # phase-1 always-on survivors
  upright: 1.0
  fall: -10.0
  torque: -0.01
  action_rate: -0.05
  # everything else off
  height: 0.0
  joint_limits: 0.0
  drift: -0.5               # s7b: low-weight music term
  facing: -1.0               # s7b: low-weight music term
  foot_slide: 0.0
  stillness: 0.0
  idle_bob: 0.0
  accent_on: 0.0
  accent_off: 0.0
  step_on_kick: 0.0
  groove: 0.0
  alternation: 0.0
  full_body: 0.0
  energy_match: 0.0
  variety: 0.0
  drop_bonus: 0.0
  drift_vel: -2.0               # s7b: low-weight music term
  spin: 0.0
  bounce: 0.3               # s7b: low-weight music term
  knee_bend: 0.0
  nod: 0.0
  arrive_approach: 0.3               # s7b: low-weight music term
  arrive_decel: 0.2               # s7b: low-weight music term
  arrive_hold: -0.2               # s7b: low-weight music term
  arrive_early: 0.0
  torso_rock: 0.0
  weight_transfer: 0.0
  aaba_same: 0.0
  mirror_alt: 0.0

amp:
  w_amp: 1.0
  window: 10                  # 0.2 s windows
  hidden: [512, 512]
  learning_rate: 1.0e-4
  w_gp: 10.0
  disc_batch: 4096
  disc_minibatches: 4         # x num_updates_per_batch = 16 discriminator steps per PPO update
  idle_frac: 0.05
  restore: true

ppo:
  num_timesteps: 200_000_000
  num_envs: 4096
  episode_length: 800
  unroll_length: 20
  batch_size: 512
  num_minibatches: 32
  num_updates_per_batch: 4
  discounting: 0.97
  learning_rate: 3.0e-4
  entropy_cost: 0.005
  clipping_epsilon: 0.2
  max_grad_norm: 1.0
  reward_scaling: 1.0
  normalize_observations: true
  num_eval_envs: 128
  policy_hidden_layer_sizes: [256, 256, 128]
  value_hidden_layer_sizes: [256, 256, 256]

checkpoint:
  num_evals: 21
